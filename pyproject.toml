[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-rag-evals"
version = "0.4.0"
description = "Failure mode eval suite for agentic RAG"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]
mcp = ["mcp>=2,<3"]

[project.scripts]
hard-rag-evals = "hard_rag_evals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hard_rag_evals*"]

[tool.setuptools.package-data]
hard_rag_evals = ["fixtures/*.json", "schemas/*.json"]
