[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-rag-evals"
version = "0.4.0"
description = "Failure mode eval suite for agentic RAG"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9", "jsonschema>=4.26", "ruff>=0.17"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
hard-rag-evals = "hard_rag_evals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hard_rag_evals*"]

[tool.setuptools.package-data]
hard_rag_evals = ["fixtures/*.json", "schemas/*.json"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
