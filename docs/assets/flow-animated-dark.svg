<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="An answer travels from the question to the agent to the grader. The grader checks run one by one: citations real, required documents, contradiction named. A plain answer passes. An answer with a hedge sentence slips past the contradiction check and passes anyway, marked gamed."><title>How the grader is gamed: a plain answer passes every check; an answer with a hedge sentence slips past the contradiction check.</title>
