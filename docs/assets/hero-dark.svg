<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Reference agent passes 7 of 12 easy, 2 of 12 medium, 1 of 13 hard, 0 of 5 brutal. Cheap tricks turn 3 failed cases into passes.">
<title>Reference agent passes 7 of 12 easy, 2 of 12 medium, 1 of 13 hard, 0 of 5 brutal. Cheap tricks turn 3 failed cases into passes.</title>
<rect x="0.5" y="0.5" width="1199" height="559" rx="24" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="80" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#898781" text-anchor="start" letter-spacing="0.2">hard-rag-evals</text>
<text x="80" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#f0efec" text-anchor="start" letter-spacing="-1.4">Where an answer stops being trustworthy.</text>
<text x="80" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#c3c2b7" text-anchor="start" >Each square is one way a RAG agent's answer breaks. 42 cases, easy to brutal.</text>
<text x="80" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c3c2b7" text-anchor="start" >Easy</text><rect x="230" y="252" width="34" height="34" rx="8" fill="#3987e5"/><rect x="273" y="252" width="34" height="34" rx="8" fill="#3987e5"/><rect x="316" y="252" width="34" height="34" rx="8" fill="#3987e5"/><rect x="359" y="252" width="34" height="34" rx="8" fill="#3987e5"/><rect x="402" y="252" width="34" height="34" rx="8" fill="#3987e5"/><rect x="445" y="252" width="34" height="34" rx="8" fill="#3987e5"/><rect x="488" y="252" width="34" height="34" rx="8" fill="#33332f"/><rect x="531" y="252" width="34" height="34" rx="8" fill="#33332f"/><rect x="574" y="252" width="34" height="34" rx="8" fill="#d95926"/><rect x="617" y="252" width="34" height="34" rx="8" fill="#33332f"/><rect x="660" y="252" width="34" height="34" rx="8" fill="#33332f"/><rect x="703" y="252" width="34" height="34" rx="8" fill="#3987e5"/><text x="809" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0efec" text-anchor="start" >7 / 12</text><text x="80" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c3c2b7" text-anchor="start" >Medium</text><rect x="230" y="306" width="34" height="34" rx="8" fill="#d95926"/><rect x="273" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="316" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="359" y="306" width="34" height="34" rx="8" fill="#3987e5"/><rect x="402" y="306" width="34" height="34" rx="8" fill="#3987e5"/><rect x="445" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="488" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="531" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="574" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="617" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="660" y="306" width="34" height="34" rx="8" fill="#33332f"/><rect x="703" y="306" width="34" height="34" rx="8" fill="#33332f"/><text x="809" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0efec" text-anchor="start" >2 / 12</text><text x="80" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c3c2b7" text-anchor="start" >Hard</text><rect x="230" y="360" width="34" height="34" rx="8" fill="#d95926"/><rect x="273" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="316" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="359" y="360" width="34" height="34" rx="8" fill="#3987e5"/><rect x="402" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="445" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="488" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="531" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="574" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="617" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="660" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="703" y="360" width="34" height="34" rx="8" fill="#33332f"/><rect x="746" y="360" width="34" height="34" rx="8" fill="#33332f"/><text x="809" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0efec" text-anchor="start" >1 / 13</text><text x="80" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c3c2b7" text-anchor="start" >Brutal</text><rect x="230" y="414" width="34" height="34" rx="8" fill="#33332f"/><rect x="273" y="414" width="34" height="34" rx="8" fill="#33332f"/><rect x="316" y="414" width="34" height="34" rx="8" fill="#33332f"/><rect x="359" y="414" width="34" height="34" rx="8" fill="#33332f"/><rect x="402" y="414" width="34" height="34" rx="8" fill="#33332f"/><text x="809" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0efec" text-anchor="start" >0 / 5</text><text x="900" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="start" >One line fools it:</text><text x="900" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0efec" text-anchor="start" >“However, the sources</text><text x="900" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0efec" text-anchor="start" >may conflict.”</text><text x="900" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="start" >Passes both contradiction</text><text x="900" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="start" >cases without detecting either.</text><circle cx="86" cy="501" r="6" fill="#3987e5"/><text x="100" y="506" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >passed</text><circle cx="184" cy="501" r="6" fill="#d95926"/><text x="198" y="506" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >gamed into a pass by a cheap trick</text><circle cx="480" cy="501" r="6" fill="#33332f"/><text x="494" y="506" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >failed</text>
</svg>
