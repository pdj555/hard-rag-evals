name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python -m pytest

  cli:
    # Installs the package the way a user would, not editable, from a clean
    # checkout, and runs it from outside the repository. Proves the fixtures
    # and the schema ship in the package and the console script works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . jsonschema
      - name: Run the reference agent and validate the report against the schema
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          hard-rag-evals run --agent reference --json > report.json
          code=$?
          set -e
          # The reference agent fails cases, so the documented exit code is 1.
          # 0 would mean the suite went soft; 2 or 3 would mean the command broke.
          test "$code" -eq 1
          hard-rag-evals schema > schema.json
          python - <<'PY'
          import json

          import jsonschema

          schema = json.load(open("schema.json"))
          report = json.load(open("report.json"))
          jsonschema.Draft202012Validator(schema).validate(report)
          summary = report["summary"]
          assert report["kind"] == "report" and summary["total"] == 42, summary
          print(f"valid: {summary['passed']}/{summary['total']} passed, grader {report['grader_version']}")
          PY
